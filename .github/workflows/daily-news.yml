name: Daily Bioinformatics News

on:
  schedule:
    - cron: "0 1 * * *"   # 08:00 WIB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout (latest commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic --quiet || true

      - name: Run news update
        env:
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY:   ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/news_update.py

      - name: Result
        run: |
          echo "### Update Selesai" >> $GITHUB_STEP_SUMMARY
          echo "Cek [News/LATEST.md](../blob/main/News/LATEST.md)" >> $GITHUB_STEP_SUMMARY
