name: Daily Update

on:
  schedule:
    - cron: "0 0 * * *"      # 07:00 WIB — trigger langsung GitHub
  workflow_dispatch:           # trigger manual dari GitHub UI
  repository_dispatch:
    types: [daily-update]     # trigger dari cron-job.org via API

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cek API key
        env:
          GROQ_API_KEY:    ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ] && [ -z "$MISTRAL_API_KEY" ]; then
            echo "ERROR: Tidak ada API key di GitHub Secrets!"
            exit 1
          fi
          [ -n "$GROQ_API_KEY" ]    && echo "GROQ_API_KEY    : tersedia ✓"
          [ -n "$MISTRAL_API_KEY" ] && echo "MISTRAL_API_KEY : tersedia ✓"

      - name: Run daily update
        env:
          GROQ_API_KEY:    ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python scripts/daily_update.py
