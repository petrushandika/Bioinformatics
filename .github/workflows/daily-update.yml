name: Daily Update

on:
  schedule:
    - cron: "17 23 * * *"     # 06:17 WIB; menit tidak bulat agar tidak tertunda antrean jam penuh
  workflow_dispatch:
    inputs:
      topics:
        description: "Jumlah topik materi yang dibuat (1-5)"
        default: "1"
      force:
        description: "Buat lagi walau update hari ini sudah ada"
        type: boolean
        default: false
  repository_dispatch:
    types: [daily-update]     # cadangan dari cron-job.org

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate documentation generator
        run: python -m unittest discover -s tests -v

      - name: Run daily update
        env:
          ROUTER_API_KEY: ${{ secrets.ROUTER_API_KEY }}
          ROUTER_BASE_URL: ${{ vars.ROUTER_BASE_URL || 'https://9router.ct.astronacci.co.id/v1' }}
          ROUTER_MODELS: ${{ vars.ROUTER_MODELS || 'cx/gpt-6.1-sol,cx/gpt-6-sol' }}
          TOPICS_PER_RUN: ${{ inputs.topics || '1' }}
        run: |
          if [ -z "$ROUTER_API_KEY" ]; then
            echo "::error::Secret ROUTER_API_KEY belum diset"
            exit 1
          fi
          python scripts/daily_update.py ${{ inputs.force && '--force' || '' }}
